name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PNPM_VERSION: 8

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Bump version
        run: pnpm version --no-git-tag-version ${{ github.event.release.tag_name }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit release files
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          branch: ${{ github.event.release.target_commitish }}
          commit_message: 'chore(release): [skip-ci] ${{ github.event.release.tag_name }}'
          file_pattern: CHANGELOG.md package.json
